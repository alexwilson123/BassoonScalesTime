<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Bassoon wallpaper</title>
  <desc id="desc">A warm, stylized bassoon illustration designed for use as a background wallpaper.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08111f" />
      <stop offset="55%" stop-color="#11273a" />
      <stop offset="100%" stop-color="#1a3d44" />
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="20%" r="48%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#6ee7b7" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5e2c10" />
      <stop offset="50%" stop-color="#8d4b1f" />
      <stop offset="100%" stop-color="#3f1b0a" />
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)" />
  <rect width="1600" height="900" fill="url(#glow)" />

  <g opacity="0.18" stroke="#cbd5e1">
    <path d="M120 120C420 40 700 40 1000 120" fill="none" stroke-width="2" />
    <path d="M600 760C980 650 1220 620 1500 680" fill="none" stroke-width="2" />
    <path d="M150 630C400 520 560 500 820 520" fill="none" stroke-width="2" />
  </g>

  <g transform="translate(770 450) rotate(-18)" filter="url(#shadow)">
    <ellipse cx="0" cy="0" rx="330" ry="210" fill="#020617" opacity="0.32" />

    <rect x="-38" y="-290" width="76" height="520" rx="26" fill="url(#wood)" />
    <rect x="42" y="-248" width="58" height="432" rx="20" fill="url(#wood)" opacity="0.95" />
    <rect x="-46" y="212" width="92" height="172" rx="28" fill="url(#wood)" />
    <rect x="34" y="170" width="74" height="210" rx="24" fill="url(#wood)" />

    <rect x="-54" y="-308" width="108" height="44" rx="18" fill="#2a1208" />
    <path d="M-8 -308 C-8 -360, 45 -388, 90 -404" fill="none" stroke="url(#metal)" stroke-width="10" stroke-linecap="round" />
    <circle cx="96" cy="-407" r="12" fill="url(#metal)" />

    <rect x="-18" y="-260" width="36" height="470" rx="14" fill="#c26b2a" opacity="0.38" />
    <rect x="60" y="-220" width="20" height="360" rx="10" fill="#c26b2a" opacity="0.34" />

    <g fill="#d6d3d1">
      <circle cx="-58" cy="-190" r="10" />
      <circle cx="-58" cy="-132" r="10" />
      <circle cx="-58" cy="-74" r="10" />
      <circle cx="-58" cy="-16" r="10" />
      <circle cx="-58" cy="42" r="10" />
      <circle cx="-58" cy="100" r="10" />
      <circle cx="-58" cy="158" r="10" />

      <circle cx="118" cy="-158" r="9" />
      <circle cx="118" cy="-102" r="9" />
      <circle cx="118" cy="-46" r="9" />
      <circle cx="118" cy="10" r="9" />
      <circle cx="118" cy="66" r="9" />
      <circle cx="118" cy="122" r="9" />
    </g>

    <g stroke="#f1f5f9" stroke-width="8" stroke-linecap="round" opacity="0.86">
      <path d="M-48 -190 L-92 -220" />
      <path d="M-48 -132 L-98 -154" />
      <path d="M-48 -74 L-92 -88" />
      <path d="M-48 -16 L-100 -18" />
      <path d="M-48 42 L-94 54" />
      <path d="M-48 100 L-98 126" />
      <path d="M-48 158 L-88 196" />

      <path d="M100 -158 L144 -182" />
      <path d="M100 -102 L148 -116" />
      <path d="M100 -46 L150 -48" />
      <path d="M100 10 L144 22" />
      <path d="M100 66 L152 90" />
      <path d="M100 122 L146 156" />
    </g>

    <ellipse cx="-8" cy="384" rx="92" ry="18" fill="#0f172a" opacity="0.45" />
  </g>
  <rect width="1600" height="900" fill="#020617" opacity="0.18" />
</svg>
