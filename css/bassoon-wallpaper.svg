<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Magical musical wallpaper</title>
  <desc id="desc">An atmospheric wallpaper with glowing music notes, drifting ribbons, and scattered stars floating through the night air.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="45%" stop-color="#10203b" />
      <stop offset="100%" stop-color="#1f3f5c" />
    </linearGradient>
    <radialGradient id="mistA" cx="18%" cy="16%" r="44%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="mistB" cx="82%" cy="24%" r="42%">
      <stop offset="0%" stop-color="#f0abfc" stop-opacity="0.26" />
      <stop offset="100%" stop-color="#f0abfc" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="mistC" cx="52%" cy="78%" r="48%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#6ee7b7" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ribbonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fcd34d" />
    </linearGradient>
    <linearGradient id="ribbonRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="50%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="ribbonMint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ccfbf1" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#67e8f9" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
    <g id="note">
      <ellipse cx="0" cy="0" rx="20" ry="16" transform="rotate(-24)" />
      <rect x="14" y="-82" width="12" height="88" rx="6" />
      <path d="M20 -82 C62 -80, 78 -48, 70 -18 L58 -18 C64 -42, 52 -62, 20 -64 Z" />
    </g>
    <g id="star">
      <path d="M0 -12 L3 -3 L12 0 L3 3 L0 12 L-3 3 L-12 0 L-3 -3 Z" />
    </g>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)" />
  <rect width="1600" height="900" fill="url(#mistA)" />
  <rect width="1600" height="900" fill="url(#mistB)" />
  <rect width="1600" height="900" fill="url(#mistC)" />

  <g opacity="0.34" fill="none" stroke-linecap="round">
    <path d="M-60 720 C180 520, 340 500, 520 610 S910 820, 1160 650 S1500 460, 1680 560" stroke="url(#ribbonGold)" stroke-width="18" />
    <path d="M-80 350 C180 220, 360 210, 530 290 S900 470, 1160 330 S1450 150, 1680 210" stroke="url(#ribbonRose)" stroke-width="12" />
    <path d="M120 920 C300 760, 430 700, 640 760 S1050 940, 1320 760 S1500 560, 1640 620" stroke="url(#ribbonMint)" stroke-width="14" />
  </g>

  <g opacity="0.7" fill="none" stroke="#dbeafe" stroke-width="2">
    <path d="M120 170 C320 110, 540 120, 760 190 S1180 320, 1470 250" />
    <path d="M180 640 C420 520, 680 520, 930 610 S1270 760, 1510 680" />
  </g>

  <g fill="#f8fafc" opacity="0.95" filter="url(#soft)">
    <use href="#star" transform="translate(150 120) scale(1.2)" />
    <use href="#star" transform="translate(320 240) scale(0.9)" />
    <use href="#star" transform="translate(480 110) scale(0.8)" />
    <use href="#star" transform="translate(670 210) scale(1.1)" />
    <use href="#star" transform="translate(820 130) scale(0.75)" />
    <use href="#star" transform="translate(1040 200) scale(1)" />
    <use href="#star" transform="translate(1220 110) scale(0.85)" />
    <use href="#star" transform="translate(1390 230) scale(1.05)" />
    <use href="#star" transform="translate(230 560) scale(0.75)" />
    <use href="#star" transform="translate(420 700) scale(1.1)" />
    <use href="#star" transform="translate(720 620) scale(0.9)" />
    <use href="#star" transform="translate(980 760) scale(0.8)" />
    <use href="#star" transform="translate(1280 660) scale(1.2)" />
    <use href="#star" transform="translate(1460 560) scale(0.9)" />
  </g>

  <g filter="url(#glow)">
    <g fill="#bfdbfe" opacity="0.82">
      <use href="#note" transform="translate(280 240) rotate(-12) scale(1.1)" />
      <use href="#note" transform="translate(580 170) rotate(10) scale(0.9)" />
      <use href="#note" transform="translate(940 260) rotate(18) scale(1.18)" />
      <use href="#note" transform="translate(1220 190) rotate(-8) scale(0.96)" />
    </g>
    <g fill="#f9a8d4" opacity="0.78">
      <use href="#note" transform="translate(420 470) rotate(16) scale(1.05)" />
      <use href="#note" transform="translate(840 410) rotate(-18) scale(1.26)" />
      <use href="#note" transform="translate(1310 420) rotate(12) scale(1.02)" />
    </g>
    <g fill="#a7f3d0" opacity="0.82">
      <use href="#note" transform="translate(190 660) rotate(-16) scale(1.22)" />
      <use href="#note" transform="translate(620 720) rotate(14) scale(0.94)" />
      <use href="#note" transform="translate(1040 640) rotate(-10) scale(1.12)" />
      <use href="#note" transform="translate(1420 720) rotate(18) scale(1.08)" />
    </g>
    <g fill="#fde68a" opacity="0.7">
      <use href="#note" transform="translate(760 560) rotate(6) scale(0.76)" />
      <use href="#note" transform="translate(1120 520) rotate(-22) scale(0.82)" />
    </g>
  </g>

  <g opacity="0.35" fill="#f8fafc">
    <circle cx="180" cy="160" r="3" />
    <circle cx="245" cy="210" r="2.4" />
    <circle cx="512" cy="292" r="2.8" />
    <circle cx="704" cy="198" r="2.2" />
    <circle cx="896" cy="338" r="2.6" />
    <circle cx="1110" cy="180" r="2.5" />
    <circle cx="1268" cy="280" r="3.2" />
    <circle cx="1460" cy="354" r="2.4" />
    <circle cx="340" cy="664" r="2.8" />
    <circle cx="826" cy="692" r="2.2" />
    <circle cx="1180" cy="732" r="2.9" />
  </g>

  <rect width="1600" height="900" fill="#020617" opacity="0.16" />
</svg>
