<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bassoon Technique Trainer • Grades 1–8</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .glass { background: rgba(30, 41, 59, 0.65); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
    .note-pill { transition: all 0.22s ease; font-variant-numeric: tabular-nums; }
    .note-pill.highlight { transform: scale(1.18); background-color: #10b981 !important; color: white; box-shadow: 0 10px 25px -5px rgba(16,185,129,0.5); }
    .note-pill.current { background-color: #eab308; color: black; box-shadow: 0 0 0 3px rgba(234,179,8,0.4); }
    .note-pill.correct { background-color: #10b981; color: white; }
    .note-pill.wrong   { background-color: #ef4444; color: white; }
    canvas { image-rendering: pixelated; }
    .tuner-bar { height: 12px; background: linear-gradient(to right, #ef4444, #eab308, #10b981, #eab308, #ef4444); border-radius: 9999px; position: relative; overflow: hidden; }
    .tuner-needle { position: absolute; top: -4px; width: 4px; height: 20px; background: white; box-shadow: 0 0 8px white; transition: left 0.05s linear; }
  </style>
</head>
<body class="bg-gradient-to-b from-slate-950 to-slate-900 text-slate-100 min-h-screen antialiased">

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 lg:py-12">

    <!-- Header -->
    <header class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-6 mb-10">
      <div>
        <h1 class="text-4xl sm:text-5xl font-bold tracking-tight bg-gradient-to-r from-emerald-400 to-teal-400 bg-clip-text text-transparent">
          Bassoon Technique
        </h1>
        <p class="mt-2 text-slate-400 text-lg">Scales • Arpeggios • Broken Chords • ABRSM 2022–2026</p>
      </div>
      <div class="text-sm text-slate-500">v2.6 • Fixed & Tuned</div>
    </header>

    <!-- Grade Tabs -->
    <div class="mb-8 overflow-x-auto pb-2 scrollbar-thin scrollbar-thumb-slate-700 scrollbar-track-slate-900">
      <div class="inline-flex bg-slate-900/70 glass rounded-full p-1.5 gap-1.5 min-w-max">
        <button onclick="selectGrade(1)" class="grade-btn px-5 py-2.5 text-sm font-medium rounded-full transition-all data-[active=true]:bg-emerald-600 data-[active=true]:text-white data-[active=true]:shadow-lg data-[active=true]:shadow-emerald-900/30 hover:bg-slate-800" data-active="true">Grade 1</button>
        <button onclick="selectGrade(2)" class="grade-btn px-5 py-2.5 text-sm font-medium rounded-full transition-all data-[active=true]:bg-emerald-600 data-[active=true]:text-white data-[active=true]:shadow-lg data-[active=true]:shadow-emerald-900/30 hover:bg-slate-800">2</button>
        <button onclick="selectGrade(3)" class="grade-btn px-5 py-2.5 text-sm font-medium rounded-full transition-all data-[active=true]:bg-emerald-600 data-[active=true]:text-white data-[active=true]:shadow-lg data-[active=true]:shadow-emerald-900/30 hover:bg-slate-800">3</button>
        <button onclick="selectGrade(4)" class="grade-btn px-5 py-2.5 text-sm font-medium rounded-full transition-all data-[active=true]:bg-emerald-600 data-[active=true]:text-white data-[active=true]:shadow-lg data-[active=true]:shadow-emerald-900/30 hover:bg-slate-800">4</button>
        <button onclick="selectGrade(5)" class="grade-btn px-5 py-2.5 text-sm font-medium rounded-full transition-all data-[active=true]:bg-emerald-600 data-[active=true]:text-white data-[active=true]:shadow-lg data-[active=true]:shadow-emerald-900/30 hover:bg-slate-800">5</button>
        <button onclick="selectGrade(6)" class="grade-btn px-5 py-2.5 text-sm font-medium rounded-full transition-all data-[active=true]:bg-emerald-600 data-[active=true]:text-white data-[active=true]:shadow-lg data-[active=true]:shadow-emerald-900/30 hover:bg-slate-800">6</button>
        <button onclick="selectGrade(7)" class="grade-btn px-5 py-2.5 text-sm font-medium rounded-full transition-all data-[active=true]:bg-emerald-600 data-[active=true]:text-white data-[active=true]:shadow-lg data-[active=true]:shadow-emerald-900/30 hover:bg-slate-800">7</button>
        <button onclick="selectGrade(8)" class="grade-btn px-5 py-2.5 text-sm font-medium rounded-full transition-all data-[active=true]:bg-emerald-600 data-[active=true]:text-white data-[active=true]:shadow-lg data-[active=true]:shadow-emerald-900/30 hover:bg-slate-800">8</button>
      </div>
    </div>

    <div class="grid lg:grid-cols-12 gap-6">

      <!-- Sidebar -->
      <aside class="lg:col-span-4 space-y-6">
        <div class="glass rounded-2xl p-5 shadow-xl shadow-black/30">
          <h3 class="text-lg font-semibold mb-4 text-slate-300">Exercise Type</h3>
          <div class="grid grid-cols-3 gap-2">
            <button id="mode-scale" onclick="setMode('scale')" class="mode-btn py-3 px-4 text-sm font-medium rounded-xl transition-all data-[active=true]:bg-emerald-600/90 data-[active=true]:text-white data-[active=true]:shadow-md hover:bg-slate-700/70" data-active="true">Scales</button>
            <button id="mode-arpeggio" onclick="setMode('arpeggio')" class="mode-btn py-3 px-4 text-sm font-medium rounded-xl transition-all data-[active=true]:bg-emerald-600/90 data-[active=true]:text-white data-[active=true]:shadow-md hover:bg-slate-700/70">Arpeggios</button>
            <button id="mode-broken" onclick="setMode('broken')" class="mode-btn py-3 px-4 text-sm font-medium rounded-xl transition-all data-[active=true]:bg-emerald-600/90 data-[active=true]:text-white data-[active=true]:shadow-md hover:bg-slate-700/70">Broken</button>
          </div>
        </div>

        <div class="glass rounded-2xl p-5 shadow-xl shadow-black/30 h-[min(65vh,760px)] overflow-y-auto scrollbar-thin scrollbar-thumb-slate-600 scrollbar-track-slate-900/50">
          <h3 class="text-lg font-semibold mb-4 text-slate-300 sticky top-0 bg-slate-900/80 backdrop-blur-sm py-3 -mx-5 px-5 z-10">Available Items</h3>
          <div id="item-list" class="space-y-3"></div>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="lg:col-span-8 space-y-6">

        <!-- Controls -->
        <div class="glass rounded-2xl p-6 shadow-xl shadow-black/30">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-5">
            <div>
              <h2 id="selected-title" class="text-2xl sm:text-3xl font-bold text-white">Select an exercise</h2>
              <p id="selected-desc" class="mt-1 text-slate-400"></p>
            </div>
            <div id="mode-dependent-btn"></div>
          </div>

          <div class="mt-4">
            <label class="block text-sm font-medium text-slate-300 mb-2">Tempo: <span id="tempo-value">72</span> BPM</label>
            <input type="range" id="tempo-slider" min="40" max="160" value="72" step="1" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-emerald-500">
          </div>

          <div class="mt-6 flex bg-slate-800 rounded-xl p-1 text-sm">
            <button onclick="setLearningMode('learning')" id="learning-btn" class="flex-1 py-3 rounded-lg font-medium transition-all data-[active=true]:bg-emerald-600 data-[active=true]:text-white" data-active="true">Learning</button>
            <button onclick="setLearningMode('practice')" id="practice-btn" class="flex-1 py-3 rounded-lg font-medium transition-all data-[active=true]:bg-emerald-600 data-[active=true]:text-white">Practice</button>
            <button onclick="setLearningMode('performance')" id="performance-btn" class="flex-1 py-3 rounded-lg font-medium transition-all data-[active=true]:bg-emerald-600 data-[active=true]:text-white">Performance</button>
          </div>
        </div>

        <!-- Live Feedback -->
        <div id="live-feedback" class="glass rounded-2xl p-5 shadow-xl shadow-black/30 hidden">
          <div class="flex items-center gap-8 justify-center">
            <div class="text-center">
              <div class="text-xs text-emerald-400 tracking-widest">EXPECTED</div>
              <div id="expected-live" class="text-4xl font-mono font-bold text-emerald-400">—</div>
            </div>
            <div class="text-5xl text-slate-600">→</div>
            <div class="text-center">
              <div class="text-xs text-orange-400 tracking-widest">YOU PLAYED</div>
              <div id="you-played-live" class="text-4xl font-mono font-bold">—</div>
            </div>
          </div>
        </div>

        <!-- Tuner -->
        <div class="glass rounded-2xl p-6 shadow-xl shadow-black/30">
          <div class="flex items-center justify-between mb-2">
            <span class="text-sm font-medium text-slate-300">LIVE TUNER</span>
            <span id="tuner-note" class="text-5xl font-mono font-bold text-emerald-400">—</span>
          </div>
          <div class="tuner-bar relative">
            <div id="tuner-needle" class="tuner-needle left-1/2"></div>
          </div>
          <div class="flex justify-between text-xs text-slate-500 mt-1 px-1">
            <span>−50¢</span><span>0¢ (in tune)</span><span>+50¢</span>
          </div>
        </div>

        <!-- Notes -->
        <div class="glass rounded-2xl p-6 shadow-xl shadow-black/30">
          <div id="notes-container" class="flex flex-wrap gap-3 min-h-[100px]"></div>
        </div>

        <!-- Visualizer + Controls -->
        <div class="glass rounded-2xl p-6 shadow-xl shadow-black/30 space-y-6">
          <div>
            <canvas id="pitch-canvas" width="800" height="100" class="w-full rounded-xl bg-slate-950/70"></canvas>
            <div class="flex justify-between text-xs text-slate-500 mt-3 px-1">
              <span>Low</span>
              <span class="font-medium">Note: <span id="live-pitch" class="text-emerald-400">--</span></span>
              <span>High</span>
            </div>
          </div>

          <div class="grid sm:grid-cols-2 gap-4">
            <button id="btn-listen" onclick="startListening()" class="inline-flex items-center justify-center gap-2 px-8 py-5 bg-orange-600 hover:bg-orange-500 active:bg-orange-700 text-white font-semibold rounded-xl shadow-lg shadow-orange-900/30 transition-all">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" /></svg>
              Start Mic
            </button>
            <button id="btn-analyze" onclick="stopAndAnalyze()" class="hidden inline-flex items-center justify-center gap-2 px-8 py-5 bg-slate-700 hover:bg-slate-600 active:bg-slate-800 text-white font-semibold rounded-xl shadow-lg transition-all">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7" /></svg>
              Stop & Check
            </button>
          </div>
        </div>

        <!-- Results -->
        <div id="results-area" class="hidden glass rounded-2xl p-6 shadow-xl shadow-black/30 space-y-6">
          <h3 class="text-xl font-semibold text-emerald-400">Your Performance</h3>
          <div id="results-rows" class="space-y-4 max-h-96 overflow-y-auto"></div>
          <div class="text-center pt-4">
            <div id="score-display" class="text-6xl font-bold text-emerald-400">—%</div>
            <p class="text-slate-400 mt-1">accuracy</p>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script>
    // ──────────────────────────────────────────────
    // STATE
    // ──────────────────────────────────────────────
    let currentGrade = 1;
    let currentMode  = 'scale';
    let currentItem  = null;
    let sequence     = [];
    let currentIndex = 0;

    let audioCtx     = null;
    let isPlaying    = false;
    let stream       = null;
    let analyser     = null;
    let rafId        = null;
    let detected     = [];
    let lastTime     = 0;
    let lastNote     = null;

    let currentTempo = 72;
    let learningMode = 'learning'; // learning | practice | performance
    let sessionRunning = false;
    let tempoTimer = null;

    const itemsByGrade = {
      1: [
        { name: "F Major scale", root: "F2", type: "major", octaves: 1,
          notes: ["F2","G2","A2","Bb2","C3","D3","E3","F3","F3","E3","D3","C3","Bb2","A2","G2","F2"] },
        { name: "Chromatic commencing on F", root: "F2", type: "chromatic", octaves: 1,
          notes: ["F2","F#2","G2","G#2","A2","Bb2","B2","C3","C#3","D3","D#3","E3","F3","F3","E3","Eb3","D3","Db3","C3","B2","Bb2","A2","Ab2","G2","Gb2","F2"] },
        { name: "F Major arpeggio / broken chord", root: "F2", type: "major", octaves: 1,
          notes: ["F2","A2","C3","F3","C3","A2","F2"] }
      ]
    };

    // ──────────────────────────────────────────────
    // HELPERS
    // ──────────────────────────────────────────────
    const NOTES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];

    function noteToMidi(s) {
      try {
        let n = s.replace(/♭/g, 'b').replace(/♯/g, '#');
        const m = n.match(/^([A-Ga-g])([#b]?)([-]?[0-8])$/i);
        if (!m) return 60;
        let [_, lettr, acc, octStr] = m;
        lettr = lettr.toUpperCase();
        let octave = parseInt(octStr);
        const base = {C:0,D:2,E:4,F:5,G:7,A:9,B:11};
        let midi = base[lettr] + (octave + 1) * 12;
        if (acc === '#') midi += 1;
        if (acc === 'b') midi -= 1;
        return midi;
      } catch { return 60; }
    }

    function midiToNote(m) {
      let o = Math.floor(m / 12) - 1;
      let i = m % 12;
      return NOTES[i] + o;
    }

    function midiToFreq(m) {
      return 440 * Math.pow(2, (m - 69) / 12);
    }

    function autoCorrelate(buf, sr) {
      const SIZE = buf.length;
      const MAX = Math.min(1024, SIZE >> 1);
      let rms = 0;
      for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
      rms = Math.sqrt(rms / SIZE);
      if (rms < 0.01) return -1;

      let best_offset = -1;
      let best_correlation = 0;

      for (let offset = 20; offset < MAX; offset++) {
        let correlation = 0;
        let count = SIZE - offset;
        for (let i = 0; i < count; i++) {
          correlation += Math.abs(buf[i] - buf[i + offset]);
        }
        correlation = 1 - (correlation / count);
        if (correlation > best_correlation) {
          best_correlation = correlation;
          best_offset = offset;
        }
      }

      if (best_correlation > 0.25 && best_offset > 0) {
        return sr / best_offset;
      }
      return -1;
    }

    // ──────────────────────────────────────────────
    // TUNER
    // ──────────────────────────────────────────────
    function updateTuner(freq) {
      const noteEl = document.getElementById('tuner-note');
      const needle = document.getElementById('tuner-needle');
      if (!noteEl || !needle) return;

      if (freq < 40) {
        noteEl.textContent = '—';
        needle.style.left = '50%';
        return;
      }

      const midi = 12 * Math.log2(freq / 440) + 69;
      const nearest = Math.round(midi);
      const cents = 1200 * Math.log2(freq / midiToFreq(nearest));

      noteEl.textContent = midiToNote(nearest);

      let pos = 50 + cents;
      pos = Math.max(0, Math.min(100, pos));
      needle.style.left = `${pos}%`;
    }

    // ──────────────────────────────────────────────
    // LISTENING
    // ──────────────────────────────────────────────
    function listen() {
      if (!analyser) {
        rafId = requestAnimationFrame(listen);
        return;
      }

      const buf = new Float32Array(analyser.fftSize);
      analyser.getFloatTimeDomainData(buf);
      const freq = autoCorrelate(buf, audioCtx.sampleRate);

      updateTuner(freq);

      if (freq > 40) {
        const midi = Math.round(12 * Math.log2(freq / 440) + 69);
        const note = midiToNote(midi);
        document.getElementById('live-pitch').textContent = note;

        const now = Date.now();
        if (note === lastNote && now - lastTime > 180) {
          const exp = sequence[currentIndex];
          const correct = note === exp;

          document.getElementById('you-played-live').textContent = note;
          document.getElementById('you-played-live').style.color = correct ? '#10b981' : '#ef4444';

          if (detected.length <= currentIndex) detected[currentIndex] = note;

          if (correct) {
            markNote(currentIndex, true);
            if (learningMode === 'practice') {
              currentIndex = Math.min(currentIndex + 1, sequence.length - 1);
              updateLiveExpected();
              if (currentIndex >= sequence.length - 1) stopSession();
            }
          } else if (learningMode === 'performance') {
            markNote(currentIndex, false);
          }
        } else if (note !== lastNote) {
          lastNote = note;
          lastTime = now;
        }
      } else {
        document.getElementById('live-pitch').textContent = '—';
        document.getElementById('you-played-live').textContent = '—';
      }

      rafId = requestAnimationFrame(listen);
    }

    // ──────────────────────────────────────────────
    // OTHER FUNCTIONS (condensed but complete)
    // ──────────────────────────────────────────────
    function selectGrade(g) {
      currentGrade = g;
      document.querySelectorAll('.grade-btn').forEach(b => {
        const t = b.textContent.trim();
        const num = t === 'Grade 1' ? 1 : parseInt(t);
        b.dataset.active = (num === g).toString();
      });
      renderItems();
    }

    function setMode(m) {
      currentMode = m;
      document.querySelectorAll('.mode-btn').forEach(b => b.dataset.active = (b.id === `mode-${m}`).toString());
      renderItems();
      currentItem = null;
      document.getElementById('selected-title').textContent = 'Select an exercise';
      document.getElementById('notes-container').innerHTML = '';
      updateModeUI();
    }

    function setLearningMode(mode) {
      learningMode = mode;
      ['learning','practice','performance'].forEach(m => {
        document.getElementById(`${m}-btn`).dataset.active = (m === mode).toString();
      });
      document.getElementById('live-feedback').classList.toggle('hidden', mode === 'learning');
      updateModeUI();
    }

    function updateModeUI() {
      const container = document.getElementById('mode-dependent-btn');
      container.innerHTML = '';
      const isLearning = learningMode === 'learning';
      const btn = document.createElement('button');
      if (isLearning) {
        btn.onclick = playSequence;
        btn.id = 'btn-play';
        btn.className = 'inline-flex items-center gap-2 px-8 py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl shadow-lg transition-all disabled:opacity-50';
        btn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/></svg> Play`;
      } else {
        btn.onclick = toggleSession;
        btn.id = 'btn-session';
        btn.className = 'inline-flex items-center gap-2 px-8 py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl shadow-lg transition-all disabled:opacity-50';
        btn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/></svg> <span>Start</span>`;
      }
      container.appendChild(btn);
    }

    function renderItems() {
      const cont = document.getElementById('item-list');
      cont.innerHTML = '';
      (itemsByGrade[currentGrade] || []).forEach(item => {
        const div = document.createElement('div');
        div.className = `px-4 py-3.5 bg-slate-800/60 hover:bg-slate-700/70 rounded-xl cursor-pointer ${currentItem?.name === item.name ? 'ring-2 ring-emerald-500' : ''}`;
        div.innerHTML = `<div class="font-medium">${item.name}</div><div class="text-xs text-slate-500">${item.octaves} oct • ${item.type}</div>`;
        div.onclick = () => loadItem(item);
        cont.appendChild(div);
      });
    }

    function loadItem(item) {
      currentItem = item;
      sequence = item.notes || [];
      currentIndex = 0;

      const label = currentMode === 'scale' ? 'Scale' : currentMode === 'arpeggio' ? 'Arpeggio' : 'Broken chords';
      document.getElementById('selected-title').textContent = `${label} – ${item.name}`;
      document.getElementById('selected-desc').textContent = `${item.octaves} octave${item.octaves>1?'s':''} • ${item.type} • Root ${item.root}`;

      const cont = document.getElementById('notes-container');
      cont.innerHTML = '';
      sequence.forEach((n, i) => {
        const p = document.createElement('div');
        p.className = 'note-pill px-5 py-3 bg-slate-800/70 rounded-lg text-center min-w-[60px] text-base font-medium';
        p.textContent = n;
        p.dataset.index = i;
        cont.appendChild(p);
      });

      document.getElementById('results-area').classList.add('hidden');
      updateLiveExpected();
      updateModeUI();
    }

    // TEMPO
    document.getElementById('tempo-slider').addEventListener('input', e => {
      currentTempo = parseInt(e.target.value);
      document.getElementById('tempo-value').textContent = currentTempo;
    });

    // PLAYBACK - Learning mode
    async function playSequence() {
      if (!currentItem || isPlaying || learningMode !== 'learning') return;
      await initAudio();
      isPlaying = true;
      const playBtn = document.getElementById('btn-play');
      if (playBtn) playBtn.disabled = true;

      const pills = document.querySelectorAll('#notes-container > div');
      const msPerBeat = 60000 / currentTempo;
      const noteDur = msPerBeat * 0.85;

      for (let i = 0; i < sequence.length; i++) {
        if (!isPlaying) break;
        pills.forEach((p, idx) => p.classList.toggle('highlight', idx === i));

        const midi = noteToMidi(sequence[i]);
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const filt = audioCtx.createBiquadFilter();

        osc.type = 'sawtooth';
        filt.type = 'lowpass';
        filt.frequency.value = 800;
        osc.frequency.value = midiToFreq(midi);
        gain.gain.value = 0.28;

        osc.connect(filt).connect(gain).connect(audioCtx.destination);
        osc.start();
        setTimeout(() => {
          gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.08);
          osc.stop(audioCtx.currentTime + 0.12);
        }, noteDur);

        await new Promise(r => setTimeout(r, msPerBeat));
      }

      pills.forEach(p => p.classList.remove('highlight'));
      isPlaying = false;
      if (playBtn) playBtn.disabled = false;
    }

    // SESSION CONTROL
    async function startSession() {
      await initAudio();
      sessionRunning = true;
      currentIndex = 0;
      detected = [];
      const btn = document.getElementById('btn-session');
      if (btn) btn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M10 9v2m4-2v2m7-5a9 9 0 01-9 9 9 9 0 01-9-9 9 9 0 019-9 9 9 0 019 9z"/></svg><span>Pause</span>`;
      document.getElementById('btn-listen')?.classList.add('hidden');
      document.getElementById('btn-analyze')?.classList.remove('hidden');

      startListening();

      if (learningMode === 'performance') startTempoTimer();
      updateLiveExpected();
    }

    function pauseSession() {
      sessionRunning = false;
      if (tempoTimer) clearTimeout(tempoTimer);
      const btn = document.getElementById('btn-session');
      if (btn) btn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/></svg><span>Resume</span>`;
    }

    function toggleSession() {
      if (!currentItem) return alert("Select an exercise first");
      if (!sessionRunning) startSession();
      else pauseSession();
    }

    function startTempoTimer() {
      const ms = 60000 / currentTempo;
      tempoTimer = setTimeout(() => {
        if (!sessionRunning || learningMode !== 'performance') return;
        currentIndex = Math.min(currentIndex + 1, sequence.length - 1);
        updateLiveExpected();
        if (currentIndex < sequence.length - 1) startTempoTimer();
        else stopSession();
      }, ms);
    }

    function updateLiveExpected() {
      document.getElementById('expected-live').textContent = sequence[currentIndex] || '—';
      document.querySelectorAll('.note-pill').forEach(p => {
        p.classList.remove('current');
        if (parseInt(p.dataset.index) === currentIndex) p.classList.add('current');
      });
    }

    function markNote(idx, correct) {
      const p = document.querySelector(`.note-pill[data-index="${idx}"]`);
      if (p) p.classList.add(correct ? 'correct' : 'wrong');
    }

    async function startListening() {
      await initAudio();
      try {
        stream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation:false, noiseSuppression:false}});
        console.log("Mic stream started");
        const src = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 1024; // reduced for performance
        src.connect(analyser);
        rafId = requestAnimationFrame(listen);
      } catch (e) {
        console.error("Mic error:", e);
        alert('Microphone access failed: ' + e.message);
      }
    }

    function stopSession() {
      if (rafId) cancelAnimationFrame(rafId);
      if (tempoTimer) clearTimeout(tempoTimer);
      if (stream) stream.getTracks().forEach(t => t.stop());
      sessionRunning = false;
      const btn = document.getElementById('btn-session');
      if (btn) btn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/></svg><span>Start Again</span>`;
    }

    function stopAndAnalyze() {
      stopSession();
      const rows = document.getElementById('results-rows');
      rows.innerHTML = '';
      let correct = 0;
      sequence.forEach((exp, i) => {
        const got = detected[i] || '—';
        const match = got === exp;
        if (match) correct++;
        const row = document.createElement('div');
        row.className = 'flex justify-between items-center bg-slate-900/50 px-5 py-3.5 rounded-xl';
        row.innerHTML = `
          <div class="flex-1"><div class="text-emerald-400 text-xs">EXPECTED</div><div class="text-lg font-medium">${exp}</div></div>
          <div class="text-center flex-1"><div class="text-orange-400 text-xs">YOU PLAYED</div><div class="text-lg font-medium ${match ? 'text-emerald-400' : 'text-red-400'}">${got}</div></div>
          <div class="text-2xl">${match ? '✅' : '❌'}</div>`;
        rows.appendChild(row);
      });
      const pct = sequence.length ? Math.round(correct / sequence.length * 100) : 0;
      document.getElementById('score-display').textContent = `${pct}%`;
      document.getElementById('results-area').classList.remove('hidden');
    }

    async function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    let canvas, ctx;
    function setupCanvas() {
      canvas = document.getElementById('pitch-canvas');
      if (canvas) ctx = canvas.getContext('2d');
    }

    function drawPitch(freq) {
      if (!ctx) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (freq < 40) {
        ctx.fillStyle = 'rgba(50,50,60,0.4)';
        ctx.fillRect(0, 40, canvas.width, 20);
        return;
      }
      const midi = Math.round(12 * Math.log2(freq / 440) + 69);
      const x = (midi % 12) / 12 * canvas.width + Math.floor(midi / 12) * 8;
      ctx.fillStyle = '#10b981';
      ctx.fillRect(0, 35, x, 30);
      ctx.fillStyle = 'white';
      ctx.font = 'bold 20px Inter';
      ctx.textAlign = 'center';
      ctx.fillText(midiToNote(midi), x, 90);
    }

    // INIT
    window.addEventListener('load', () => {
      setupCanvas();
      selectGrade(1);
      setMode('scale');
      renderItems();
      setLearningMode('learning');

      setTimeout(() => {
        const first = itemsByGrade[1]?.[0];
        if (first) loadItem(first);
      }, 400);
    });
  </script>
</body>
</html>
